name: 翻译课程

# 使用 NLLB-200 对符合条件的课程正文进行机器翻译,这是一个在 runner 内运行的
# 免费开源模型。无需 API key,也没有 Vercel 成本。结果会推送到配置的
# 发布分支(默认为 `translations`);main 分支保持纯英文。
#
# 按 (语言, 阶段) 拆分为每项一个 job。一次完整的 511 节课程语言运行在
# CPU runner 上大约需要 27 小时,远超 6 小时的 job 时限,因此按语言拆分的
# job 在发布前总会超时,什么也存不下来。按阶段拆分使最大的 job
# (阶段 19,85 节课)保持在约 4.5 小时,远低于时限,且每个 job
# 只发布自己那一阶段的切片。
#
# 永不浪费工作量:每节课都在按 (语言, 阶段) 划分的缓存文件中做哈希缓存,
# 在 job 结束时发布。已完成的运行只会重新翻译英文发生变化的课程,
# 互不重叠的阶段切片可以干净地合并。
#
# 仓库 README 是按语言手工编写的,并提交到 main 分支
# (见 scripts/build_readme_i18n.py 和 docs/i18n.md);它不属于此矩阵的一部分。

on:
  push:
    branches: [main]
    paths:
      - "phases/**/docs/en.md"
      - "languages.json"
      - "scripts/translate_lessons.py"
      - "scripts/audit_translations.py"
      - ".github/translate-requirements.txt"
      # 发布器的修复必须能够引导创建一个缺失的已配置分支,
      # 即使同一次合并中没有任何英文课程发生变化。
      - ".github/workflows/translate.yml"
  workflow_dispatch:
    inputs:
      langs:
        description: "机器管理的语言代码;留空 = ci:true(排除手动维护的本地化)"
        default: ""
      phase:
        description: "单个阶段目录(例如 01-math-foundations);留空 = 全部阶段"
        default: ""

concurrency:
  group: translate
  cancel-in-progress: false

env:
  # 让发布器保持在站点和课程审计所消费的同一来源上。github.token 仅
  # 专用于本仓库;已配置的外部源为只读,会禁用本工作流的 jobs。
  AIFS_TRANSLATION_REPOSITORY: ${{ vars.AIFS_TRANSLATION_REPOSITORY || github.repository }}
  AIFS_TRANSLATION_REF: ${{ vars.AIFS_TRANSLATION_REF || 'translations' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      langs: ${{ steps.set.outputs.langs }}
      phases: ${{ steps.set.outputs.phases }}
      publish_enabled: ${{ steps.translation_target.outputs.publish_enabled }}
    steps:
      - name: 强制执行翻译发布边界
        id: translation_target
        run: |
          case "$AIFS_TRANSLATION_REF" in
            ""|@|-*|refs/*)
              echo "::error title=无效的翻译引用::AIFS_TRANSLATION_REF 必须使用短引用命名一个分支"
              exit 1
              ;;
          esac
          if ! git check-ref-format "refs/heads/$AIFS_TRANSLATION_REF" >/dev/null; then
            echo "::error title=无效的翻译引用::AIFS_TRANSLATION_REF 必须使用短引用命名一个分支"
            exit 1
          fi
          if [ "$AIFS_TRANSLATION_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "publish_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=翻译发布已禁用::AIFS_TRANSLATION_REPOSITORY 指向一个外部只读源;github.token 无法跨仓库写入"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: set
        env:
          REQUESTED: ${{ github.event.inputs.langs }}
          REQUESTED_PHASE: ${{ github.event.inputs.phase }}
        run: |
          # 每个输出的代码都必须是机器管理的注册条目。人工维护的本地化
          # (如 zh)永远不会经过 NLLB,包括手动触发时也不会,这样已评审的
          # 翻译就不会被覆盖。
          if [ -n "$REQUESTED" ]; then
            JSON=$(jq -c --arg req "$REQUESTED" \
              '($req | split(" ") | map(select(length > 0))) as $want
               | [.languages[] | select(.source != true and .manual != true) | .code] as $known
               | [$want[] | select(. as $c | $known | index($c))]' languages.json)
          else
            JSON=$(jq -c '[.languages[] | select(.ci == true and .manual != true) | .code]' languages.json)
          fi
          if [ "$JSON" = "[]" ]; then
            echo "未选中任何机器管理的语言" >&2
            exit 1
          fi
          echo "langs=$JSON" >> "$GITHUB_OUTPUT"
          # 手动运行可以选择单个阶段,作为低成本的端到端冒烟测试。
          # push 运行和留空的手动输入保留完整的阶段矩阵。
          if [ -n "$REQUESTED_PHASE" ]; then
            PHASE_LIST=$(find phases -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
              | grep -E '^[0-9]{2}-[a-z0-9-]+$' | sort)
            if ! printf '%s\n' "$PHASE_LIST" | grep -Fqx -- "$REQUESTED_PHASE"; then
              echo "未知阶段: $REQUESTED_PHASE" >&2
              exit 1
            fi
            PHASES=$(jq -cn --arg phase "$REQUESTED_PHASE" '[$phase]')
          else
            # 每个阶段目录(NN-name)一个分片;README 不在此矩阵中处理
            PHASES=$(find phases -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
              | grep -E '^[0-9]{2}-[a-z0-9-]+$' | sort | jq -R . | jq -cs .)
          fi
          echo "phases=$PHASES" >> "$GITHUB_OUTPUT"

  translate:
    needs: prepare
    if: needs.prepare.outputs.publish_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      NLLB_MODEL: facebook/nllb-200-distilled-600M
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lang: ${{ fromJSON(needs.prepare.outputs.langs) }}
        phase: ${{ fromJSON(needs.prepare.outputs.phases) }}
    steps:
      - name: 检出 main（英文源）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 配置翻译发布远端
        run: |
          # 读取始终使用一个无需凭据的 remote。这个覆盖项的存在只是
          # 为了让本地回归测试可以使用一个裸仓库。
          if [ -n "${TRANSLATION_TEST_REMOTE_URL:-}" ]; then
            TRANSLATION_REMOTE_URL=$TRANSLATION_TEST_REMOTE_URL
          else
            TRANSLATION_REMOTE_URL="https://github.com/${AIFS_TRANSLATION_REPOSITORY}.git"
          fi
          git remote remove aifs-translations 2>/dev/null || true
          git remote add aifs-translations "$TRANSLATION_REMOTE_URL"

      - name: 从配置分支恢复当前语言的 cache 与输出
        env:
          LANG_CODE: ${{ matrix.lang }}
        run: |
          TRANSLATION_REMOTE_REF="refs/heads/$AIFS_TRANSLATION_REF"
          TRANSLATION_TRACKING_REF="refs/remotes/aifs-translations/source"
          set +e
          git ls-remote --exit-code aifs-translations "$TRANSLATION_REMOTE_REF" >/dev/null
          TRANSLATION_STATUS=$?
          set -e
          if [ "$TRANSLATION_STATUS" -eq 0 ]; then
            git fetch --no-tags aifs-translations \
              "+${TRANSLATION_REMOTE_REF}:${TRANSLATION_TRACKING_REF}"
          elif [ "$TRANSLATION_STATUS" -eq 2 ]; then
            echo "翻译分支尚未发布;从英文 HEAD 开始"
          else
            echo "无法检查已配置的翻译源" >&2
            exit "$TRANSLATION_STATUS"
          fi
          mkdir -p "i18n/$LANG_CODE"
          if git cat-file -e "${TRANSLATION_TRACKING_REF}:i18n/$LANG_CODE" 2>/dev/null; then
            git archive "$TRANSLATION_TRACKING_REF" "i18n/$LANG_CODE" | tar -x
          fi

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/translate-requirements.txt

      - name: 缓存 NLLB 模型
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.NLLB_MODEL }}

      - name: 安装 NLLB 运行环境
        run: pip install -r .github/translate-requirements.txt

      - name: 翻译当前阶段有变更的课程（NLLB-200，无需 key）
        env:
          TRANSLATE_PROVIDER: nllb
          LANG_CODE: ${{ matrix.lang }}
          PHASE: ${{ matrix.phase }}
        run: |
          # 矩阵值仅通过 env 到达 shell;使用前重新检查阶段
          # 形式,确保只有 NN-name 才能被传递。
          case "$PHASE" in
            [0-9][0-9]-*) ;;
            *) echo "意外的阶段名: $PHASE" >&2; exit 1 ;;
          esac
          python3 scripts/translate_lessons.py --lang "$LANG_CODE" --phase "$PHASE"

      - name: 审计当前阶段的课程译文分片
        env:
          LANG_CODE: ${{ matrix.lang }}
          PHASE: ${{ matrix.phase }}
        run: |
          python3 scripts/audit_translations.py \
            --lang "$LANG_CODE" \
            --phase "$PHASE" \
            --translation-root .

      - name: 将当前阶段分片发布到配置分支（竞态安全）
        env:
          GH_TOKEN: ${{ github.token }}
          LANG_CODE: ${{ matrix.lang }}
          PHASE: ${{ matrix.phase }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SLICE="i18n/$LANG_CODE/phases/$PHASE"
          CACHE="i18n/$LANG_CODE/.cache/$PHASE.json"
          PUBLISH_DIR="$RUNNER_TEMP/translation-publish"
          TRANSLATION_REMOTE_REF="refs/heads/$AIFS_TRANSLATION_REF"
          TRANSLATION_TRACKING_REF="refs/remotes/aifs-translations/source"

          cleanup_publish_worktree() {
            # 仅删除目录会留下 Git 的 worktree 注册信息,
            # 导致下次重试无法重建。两者都要删除。
            git worktree remove --force "$PUBLISH_DIR" 2>/dev/null || true
            rm -rf "$PUBLISH_DIR"
            git worktree prune
          }
          trap cleanup_publish_worktree EXIT

          # 只同步此 (语言, 阶段) 切片及其缓存。同一语言的其他阶段
          # 原封不动地留在分支上,因此并行的分片可以互不破坏地合并。
          # 独立的 worktree 让每次重试都能从最新的远程分支重建,而不会
          # 因陈旧的本地分支或已删除但仍在注册中的 worktree 而阻塞下次尝试。
          for attempt in 1 2 3 4 5 6 7 8; do
            cleanup_publish_worktree
            set +e
            git ls-remote --exit-code aifs-translations "$TRANSLATION_REMOTE_REF" >/dev/null
            TRANSLATION_STATUS=$?
            set -e
            if [ "$TRANSLATION_STATUS" -eq 0 ]; then
              if git fetch --no-tags aifs-translations \
                "+${TRANSLATION_REMOTE_REF}:${TRANSLATION_TRACKING_REF}"; then
                BASE=$TRANSLATION_TRACKING_REF
              else
                echo "无法拉取已配置的翻译源" >&2
                sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
                continue
              fi
            elif [ "$TRANSLATION_STATUS" -eq 2 ]; then
              # 第一个成功的分片会创建已配置的分支。并发创建者会使
              # 这次 push 正常失败;下次尝试会拉取那个胜出者,只重新应用本分片。
              BASE=HEAD
            else
              echo "无法检查已配置的翻译源" >&2
              sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
              continue
            fi
            git worktree add --detach "$PUBLISH_DIR" "$BASE"
            rm -rf "$PUBLISH_DIR/$SLICE"
            mkdir -p "$PUBLISH_DIR/$(dirname "$SLICE")" "$PUBLISH_DIR/i18n/$LANG_CODE/.cache"
            [ -d "$SLICE" ] && cp -r "$SLICE" "$PUBLISH_DIR/$SLICE"
            [ -f "$CACHE" ] && cp "$CACHE" "$PUBLISH_DIR/$CACHE"
            ( cd "$PUBLISH_DIR" || exit 1
              # -f:翻译分支是从 main 的检出创建的(当它尚不存在时),
              # 因此会带有 main 的 .gitignore,而该文件刻意把
              # i18n/*/phases/ 和 i18n/*/.cache/ 从 main 中排除。同一条
              # 规则会在此处把普通的 `git add` 静默变成空操作,于是
              # 每次发布都报告"无变更",什么都推不上去。强制越过它:
              # 这个分支的存在就是为了存放这些文件。
              if ! git add -f "i18n/$LANG_CODE"; then
                echo "无法暂存翻译切片" >&2
                exit 1
              fi
              # 没有暂存内容是唯一一种成功但不推送的情况;真正的
              # 提交或推送失败必须落到重试,而不是被当作"无变更"吞掉
              if git diff --cached --quiet; then
                echo "无变更"
                exit 0
              else
                DIFF_STATUS=$?
                if [ "$DIFF_STATUS" -ne 1 ]; then
                  echo "无法检查已暂存的翻译切片" >&2
                  exit 1
                fi
              fi
              if ! git commit -m "chore(i18n): $LANG_CODE / $PHASE (NLLB-200)"; then
                echo "无法提交翻译切片" >&2
                exit 1
              fi
              # 本地回归测试夹具无需凭据。在 GitHub 上,仅为此 push
              # 添加写凭据;绝不将其持久化到 remote URL、push URL 或凭据助手中。
              if [ -n "${TRANSLATION_TEST_REMOTE_URL:-}" ]; then
                if ! git push aifs-translations "HEAD:${TRANSLATION_REMOTE_REF}"; then
                  echo "无法推送翻译切片" >&2
                  exit 1
                fi
              else
                AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
                if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
                  push aifs-translations "HEAD:${TRANSLATION_REMOTE_REF}"; then
                  echo "无法推送翻译切片" >&2
                  exit 1
                fi
              fi ) && exit 0
            echo "推送竞争,正在重试 ($attempt)"
            sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
          done
          echo "重试后仍无法发布" >&2; exit 1

  cleanup:
    needs: [prepare, translate]
    if: >-
      ${{ always() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.publish_enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出 main（规范课程源）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 配置翻译清理远端
        run: |
          if [ -n "${TRANSLATION_TEST_REMOTE_URL:-}" ]; then
            TRANSLATION_REMOTE_URL=$TRANSLATION_TEST_REMOTE_URL
          else
            TRANSLATION_REMOTE_URL="https://github.com/${AIFS_TRANSLATION_REPOSITORY}.git"
          fi
          git remote remove aifs-translations 2>/dev/null || true
          git remote add aifs-translations "$TRANSLATION_REMOTE_URL"

      - name: 清理已删除的翻译产物（竞态安全）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PUBLISH_DIR="$RUNNER_TEMP/translation-cleanup"
          CANONICAL_PHASES="$RUNNER_TEMP/canonical-translation-phases"
          CANONICAL_LESSONS="$RUNNER_TEMP/canonical-translation-lessons"
          CANONICAL_LESSONS_JSON="$RUNNER_TEMP/canonical-translation-lessons.json"
          PUBLISHED_LANGS="$RUNNER_TEMP/published-translation-languages"
          REGISTERED_LANGS="$RUNNER_TEMP/registered-translation-languages"
          REMOTE_LANGS="$RUNNER_TEMP/remote-translation-languages"
          CANDIDATE_PHASES="$RUNNER_TEMP/translation-cleanup-candidates"
          CANDIDATE_LESSONS="$RUNNER_TEMP/translation-cleanup-lessons"
          TRANSLATION_REMOTE_REF="refs/heads/$AIFS_TRANSLATION_REF"
          TRANSLATION_TRACKING_REF="refs/remotes/aifs-translations/source"

          # 清理是一个 job,而不是又一个 (语言, 阶段) 矩阵。这样在覆盖
          # 每个已发布的非源本地化的同时,把翻译矩阵保持在 GitHub 的
          # 256-job 上限之下。手动维护的本地化永远不会在这里被机器翻译,
          # 但它们孤立的阶段切片仍必须被清理。
          find phases -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
            | { grep -E '^[0-9]{2}-[a-z0-9-]+$' || true; } | sort -u > "$CANONICAL_PHASES"
          find phases -mindepth 4 -maxdepth 4 -type f -path '*/docs/en.md' \
            | { grep -E '^phases/[0-9]{2}-[a-z0-9-]+/[0-9]{2}-[a-z0-9-]+/docs/en\.md$' || true; } \
            | sort -u > "$CANONICAL_LESSONS"
          jq -Rsc 'split("\n") | map(select(length > 0))' \
            "$CANONICAL_LESSONS" > "$CANONICAL_LESSONS_JSON"
          jq -r '.languages[]
            | select(.source != true)
            | .code' languages.json > "$PUBLISHED_LANGS"
          jq -r '.languages[].code' languages.json > "$REGISTERED_LANGS"

          cleanup_publish_worktree() {
            git worktree remove --force "$PUBLISH_DIR" 2>/dev/null || true
            rm -rf "$PUBLISH_DIR"
            git worktree prune
          }
          trap cleanup_publish_worktree EXIT

          prune_cache_file() {
            local CACHE_FILE=$1
            local PHASE=${2:-}
            local ORPHAN_COUNT
            local CACHE_TMP
            [ -f "$CACHE_FILE" ] || return 0

            if [ -n "$PHASE" ]; then
              ORPHAN_COUNT=$(jq --slurpfile allowed "$CANONICAL_LESSONS_JSON" \
                --arg prefix "phases/$PHASE/" '
                  [keys[] as $key | $key
                    | select(
                        (($key | startswith($prefix)) | not)
                        or (($allowed[0] | index($key)) == null)
                      )]
                  | length
                ' "$CACHE_FILE")
            else
              ORPHAN_COUNT=$(jq --slurpfile allowed "$CANONICAL_LESSONS_JSON" '
                  [keys[] as $key | $key
                    | select(($allowed[0] | index($key)) == null)]
                  | length
                ' "$CACHE_FILE")
            fi
            [ "$ORPHAN_COUNT" -gt 0 ] || return 0

            CACHE_TMP="$CACHE_FILE.cleanup.$$"
            if [ -n "$PHASE" ]; then
              jq --slurpfile allowed "$CANONICAL_LESSONS_JSON" \
                --arg prefix "phases/$PHASE/" '
                  with_entries(
                    .key as $key
                    | select(
                        ($key | startswith($prefix))
                        and (($allowed[0] | index($key)) != null)
                      )
                  )
                ' "$CACHE_FILE" > "$CACHE_TMP"
            else
              jq --slurpfile allowed "$CANONICAL_LESSONS_JSON" '
                  with_entries(
                    .key as $key
                    | select(($allowed[0] | index($key)) != null)
                  )
                ' "$CACHE_FILE" > "$CACHE_TMP"
            fi
            mv "$CACHE_TMP" "$CACHE_FILE"
            REMOVED=1
          }

          # 每次尝试都从最新发布尖端开始,只应用由规范 main 所隐含的
          # 删除。显式的租约也会检查空操作尝试:如果在我们 fetch 之后
          # 有并发分片发布,push 会失败,重试会在再次清理前保留该分片。
          for attempt in 1 2 3 4 5 6 7 8; do
            cleanup_publish_worktree
            set +e
            git ls-remote --exit-code aifs-translations "$TRANSLATION_REMOTE_REF" >/dev/null
            TRANSLATION_STATUS=$?
            set -e
            if [ "$TRANSLATION_STATUS" -eq 2 ]; then
              echo "翻译分支尚未发布;无可清理内容"
              exit 0
            elif [ "$TRANSLATION_STATUS" -ne 0 ]; then
              echo "无法检查已配置的翻译源" >&2
              sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
              continue
            fi
            if ! git fetch --no-tags aifs-translations \
              "+${TRANSLATION_REMOTE_REF}:${TRANSLATION_TRACKING_REF}"; then
              echo "无法拉取已配置的翻译源" >&2
              sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
              continue
            fi
            git worktree add --detach "$PUBLISH_DIR" "$TRANSLATION_TRACKING_REF"
            BASE_OID=$(git rev-parse "$TRANSLATION_TRACKING_REF")

            : > "$REMOTE_LANGS"
            if [ -d "$PUBLISH_DIR/i18n" ]; then
              find "$PUBLISH_DIR/i18n" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
                | { grep -E '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$' || true; } \
                | sort -u > "$REMOTE_LANGS"
            fi

            REMOVED=0
            while IFS= read -r LANG_CODE; do
              if ! grep -Fqx -- "$LANG_CODE" "$REGISTERED_LANGS"; then
                # 本工作流只拥有已翻译的课程切片和缓存。当某个本地化
                # 被下线时,保留手工编写的 README/资源。
                if [ -d "$PUBLISH_DIR/i18n/$LANG_CODE/phases" ] \
                  || [ -d "$PUBLISH_DIR/i18n/$LANG_CODE/.cache" ] \
                  || [ -f "$PUBLISH_DIR/i18n/$LANG_CODE/.translate-cache.json" ]; then
                  rm -rf "$PUBLISH_DIR/i18n/$LANG_CODE/phases"
                  rm -rf "$PUBLISH_DIR/i18n/$LANG_CODE/.cache"
                  rm -f "$PUBLISH_DIR/i18n/$LANG_CODE/.translate-cache.json"
                  REMOVED=1
                fi
                continue
              fi
              # 源语言内容从不由本发布器拥有。
              if ! grep -Fqx -- "$LANG_CODE" "$PUBLISHED_LANGS"; then
                continue
              fi
              if ! [[ "$LANG_CODE" =~ ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]]; then
                echo "意外的已发布语言代码: $LANG_CODE" >&2
                exit 1
              fi
              : > "$CANDIDATE_PHASES"
              if [ -d "$PUBLISH_DIR/i18n/$LANG_CODE/phases" ]; then
                find "$PUBLISH_DIR/i18n/$LANG_CODE/phases" \
                  -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
                  >> "$CANDIDATE_PHASES"
              fi
              if [ -d "$PUBLISH_DIR/i18n/$LANG_CODE/.cache" ]; then
                find "$PUBLISH_DIR/i18n/$LANG_CODE/.cache" \
                  -mindepth 1 -maxdepth 1 -type f -name '*.json' \
                  -exec basename {} .json \; >> "$CANDIDATE_PHASES"
              fi
              sort -u -o "$CANDIDATE_PHASES" "$CANDIDATE_PHASES"
              while IFS= read -r PHASE; do
                [[ "$PHASE" =~ ^[0-9]{2}-[a-z0-9-]+$ ]] || continue
                if ! grep -Fqx -- "$PHASE" "$CANONICAL_PHASES"; then
                  rm -rf "$PUBLISH_DIR/i18n/$LANG_CODE/phases/$PHASE"
                  rm -f "$PUBLISH_DIR/i18n/$LANG_CODE/.cache/$PHASE.json"
                  REMOVED=1
                  continue
                fi

                : > "$CANDIDATE_LESSONS"
                if [ -d "$PUBLISH_DIR/i18n/$LANG_CODE/phases/$PHASE" ]; then
                  find "$PUBLISH_DIR/i18n/$LANG_CODE/phases/$PHASE" \
                    -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
                    | sort -u > "$CANDIDATE_LESSONS"
                fi
                while IFS= read -r LESSON; do
                  [[ "$LESSON" =~ ^[0-9]{2}-[a-z0-9-]+$ ]] || continue
                  SOURCE_KEY="phases/$PHASE/$LESSON/docs/en.md"
                  if ! grep -Fqx -- "$SOURCE_KEY" "$CANONICAL_LESSONS"; then
                    rm -rf "$PUBLISH_DIR/i18n/$LANG_CODE/phases/$PHASE/$LESSON"
                    REMOVED=1
                  fi
                done < "$CANDIDATE_LESSONS"
                prune_cache_file \
                  "$PUBLISH_DIR/i18n/$LANG_CODE/.cache/$PHASE.json" "$PHASE"
              done < "$CANDIDATE_PHASES"
              if find "$PUBLISH_DIR/i18n/$LANG_CODE/.cache" \
                -mindepth 1 -maxdepth 1 -type f -name '*.json' -print -quit \
                2>/dev/null | grep -q .; then
                # 一个本地化必须只发布一种缓存布局。一旦存在任何阶段
                # 分片,它就是权威的,因此丢弃遗留的合并缓存,而不是
                # 留下一个审计冲突。
                if [ -f "$PUBLISH_DIR/i18n/$LANG_CODE/.translate-cache.json" ]; then
                  rm -f "$PUBLISH_DIR/i18n/$LANG_CODE/.translate-cache.json"
                  REMOVED=1
                fi
              else
                prune_cache_file \
                  "$PUBLISH_DIR/i18n/$LANG_CODE/.translate-cache.json"
              fi
            done < "$REMOTE_LANGS"

            ( cd "$PUBLISH_DIR" || exit 1
              if [ "$REMOVED" -ne 0 ]; then
                if ! git add -u -- i18n; then
                  echo "无法暂存已删除的翻译制品" >&2
                  exit 1
                fi
              fi
              if git diff --cached --quiet; then
                CLEANUP_CHANGED=0
              else
                DIFF_STATUS=$?
                if [ "$DIFF_STATUS" -ne 1 ]; then
                  echo "无法检查已暂存的翻译清理" >&2
                  exit 1
                fi
                CLEANUP_CHANGED=1
                if ! git commit -m "chore(i18n): prune deleted translation artifacts"; then
                  echo "无法提交翻译清理" >&2
                  exit 1
                fi
              fi
              if [ -n "${TRANSLATION_TEST_REMOTE_URL:-}" ]; then
                if ! git push \
                  --force-with-lease="${TRANSLATION_REMOTE_REF}:${BASE_OID}" \
                  aifs-translations "HEAD:${TRANSLATION_REMOTE_REF}"; then
                  echo "无法推送翻译清理" >&2
                  exit 1
                fi
              else
                AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
                if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
                  push --force-with-lease="${TRANSLATION_REMOTE_REF}:${BASE_OID}" \
                  aifs-translations "HEAD:${TRANSLATION_REMOTE_REF}"; then
                  echo "无法推送翻译清理" >&2
                  exit 1
                fi
              fi
              if [ "$CLEANUP_CHANGED" -eq 0 ]; then
                echo "无已删除的翻译制品"
              fi ) && exit 0
            echo "清理推送竞争,正在重试 ($attempt)"
            sleep "${TRANSLATION_PUBLISH_RETRY_DELAY:-$((RANDOM % 12 + 3))}"
          done
          echo "重试后仍无法清理已删除的翻译制品" >&2; exit 1
